<script>
/* ===================== Model data (fixed) =====================
   Ellisford Clinics, CareSlot telehealth scheduling app, design review before launch.
   All answers below are computed from these arrays. */
(function () {
  var N = {
    E1: { nm: 'Patient', kd: 'External entity', t: 'ext', x: 20, y: 52, w: 150, h: 60 },
    E2: { nm: 'Clinician', kd: 'External entity', t: 'ext', x: 20, y: 372, w: 150, h: 60 },
    P1: { nm: 'API gateway', kd: 'Process', t: 'proc', cx: 330, cy: 232, r: 60 },
    P2: { nm: 'Scheduling', kd: 'Process', t: 'proc', cx: 560, cy: 232, r: 60 },
    P3: { nm: 'Eligibility', kd: 'Process', t: 'proc', cx: 760, cy: 92, r: 50 },
    P4: { nm: 'Reminders', kd: 'Process', t: 'proc', cx: 760, cy: 322, r: 50 },
    D1: { nm: 'D1 Appointments', kd: 'Data store', t: 'store', x: 420, y: 408, w: 170, h: 40 },
    D2: { nm: 'D2 Audit log', kd: 'Data store', t: 'store', x: 620, y: 432, w: 150, h: 40 },
    E3: { nm: 'Insurer API', kd: 'External entity', t: 'ext', x: 900, y: 62, w: 124, h: 60 },
    E4: { nm: 'SMS provider', kd: 'External entity', t: 'ext', x: 900, y: 292, w: 124, h: 60 }
  };
  var F = [
    { id: 'F1', a: 'E1', b: 'P1', off: -10, nm: 'Booking request', cross: true },
    { id: 'F2', a: 'P1', b: 'E1', off: -10, nm: 'Booking confirmation', cross: true },
    { id: 'F3', a: 'E2', b: 'P1', off: 0, nm: 'Clinician schedule query', cross: true },
    { id: 'F4', a: 'P1', b: 'P2', off: 0, nm: 'Validated request, with session identity', cross: true },
    { id: 'F5', a: 'P2', b: 'D1', off: -10, nm: 'Write appointment', cross: false },
    { id: 'F6', a: 'D1', b: 'P2', off: -10, nm: 'Read open slots', cross: false },
    { id: 'F7', a: 'P2', b: 'P3', off: 0, nm: 'Eligibility check request', cross: false },
    { id: 'F8', a: 'P3', b: 'E3', off: -10, nm: 'Coverage query', cross: true },
    { id: 'F9', a: 'E3', b: 'P3', off: -10, nm: 'Coverage response', cross: true },
    { id: 'F10', a: 'P2', b: 'P4', off: 0, nm: 'Reminder job', cross: false },
    { id: 'F11', a: 'P4', b: 'E4', off: 0, nm: 'Reminder text message', cross: true },
    { id: 'F12', a: 'P2', b: 'D2', off: 0, nm: 'Audit event', cross: false }
  ];
  /* Threats. L and I are the keyed scores from the scoring guide; evidence states the facts. */
  var T = [
    { id: 'T1', el: 'P1 API gateway', s: 'S', th: 'An attacker signs in as patients with passwords leaked from other sites (credential stuffing).',
      ev: 'Sign-in is password only. Gateway logs show about 40,000 failed sign-ins a week from rotating addresses since the beta opened. A successful attacker could take over many patient accounts.', L: 5, I: 4,
      mt: ['Raise the minimum password length to 14', 'Phishing-resistant MFA (passkeys), breached-password screening, and sign-in rate limits', 'Add a CAPTCHA to the sign-in page', 'Lock each account permanently after three failures'], mk: 1 },
    { id: 'T2', el: 'P2 Scheduling', s: 'T', th: 'A signed-in patient changes another patient&rsquo;s appointment by editing the appointment ID in the request.',
      ev: 'Confirmed by the beta penetration test and not yet fixed. Anyone can create a patient account. Appointment IDs are sequential, so one patient could alter many appointments.', L: 4, I: 4,
      mt: ['Hide the appointment ID in the mobile app', 'Validate the ID format at the gateway', 'Check in the scheduling service that the signed-in patient owns the appointment', 'Encrypt the appointments database'], mk: 2 },
    { id: 'T3', el: 'D2 Audit log', s: 'R', th: 'A clinician denies canceling a patient&rsquo;s appointment, and the log cannot show who did it.',
      ev: 'The audit log records the scheduling service account, not the person. Only clinic staff can cancel, so this needs an insider. A dispute would be an internal matter with no health information exposed.', L: 2, I: 2,
      mt: ['Record the authenticated user, time, and action in an append-only log', 'Remove the ability to cancel', 'Email every cancellation to the clinic manager', 'Keep the log for ten years'], mk: 0 },
    { id: 'T4', el: 'F11 Reminder text', s: 'I', th: 'Reminder texts reveal the reason for the visit to anyone who sees the patient&rsquo;s phone.',
      ev: 'Every reminder includes the visit reason, such as a test result follow-up, and lock screens show message previews. This happens in normal operation, not only under attack. Each message exposes one patient.', L: 4, I: 3,
      mt: ['Move to a different SMS provider', 'Send only the date, time, and clinic, and show details after sign-in', 'Encrypt the text message', 'Ask patients to turn off lock screen previews'], mk: 1 },
    { id: 'T5', el: 'P1 API gateway', s: 'D', th: 'A bot flood during the flu vaccine campaign takes booking offline for every clinic.',
      ev: 'The gateway is internet facing and has no rate limiting or bot protection. No flood has been seen yet. Phone booking would still work, but online booking would be down for all clinics.', L: 3, I: 4,
      mt: ['Add more gateway servers', 'Rate limits, bot protection, and a provider DDoS service in front of the gateway', 'Close online booking during campaigns', 'Block foreign IP addresses'], mk: 1 },
    { id: 'T6', el: 'P2 Scheduling', s: 'E', th: 'An injection flaw in slot search lets an attacker run commands with the service&rsquo;s database administrator rights.',
      ev: 'Code review found parameterized queries throughout, and SAST is clean. An attack would need a new flaw on top of those controls. The service account is a database administrator, so success would expose every patient record.', L: 2, I: 5,
      mt: ['Run the service with a least-privilege database account', 'Turn off slot search', 'Add a second SAST tool', 'Move the database to another cloud region'], mk: 0 },
    { id: 'T7', el: 'F9 Coverage response', s: 'T', th: 'A forged coverage response tells the clinic a patient is covered when they are not.',
      ev: 'Certificate validation is turned off in the eligibility service configuration. An attacker would need a position on the network path to exploit it. A forged response affects one patient&rsquo;s visit.', L: 2, I: 3,
      mt: ['Ask the insurer to sign its responses', 'Turn certificate validation back on and pin the insurer&rsquo;s certificate authority', 'Check coverage again at check-in', 'Log every coverage response'], mk: 1 },
    { id: 'T8', el: 'D1 Appointments', s: 'I', th: 'Nightly backups of the appointments database can be read by any account at the cloud provider.',
      ev: 'The cloud-native application protection platform (CNAPP) flagged the backup bucket: its policy grants read access to any authenticated account at the provider, and anyone can open a free account. The backups hold every patient&rsquo;s appointments and visit reasons.', L: 4, I: 5,
      mt: ['Remove the broad grant, limit reads to the backup role, and make the CNAPP check a deployment gate', 'Rename the bucket so it is harder to guess', 'Encrypt the backups with the provider-managed key', 'Move backups to a cheaper storage tier'], mk: 0 }
  ];
  function score(t) { return t.L * t.I; }
  var ranked = T.slice().sort(function (a, b) { return score(b) - score(a) || b.I - a.I || (a.id < b.id ? -1 : 1); });
  window.B1DATA = {
    N: N, F: F, T: T,
    answers: {
      cross: F.filter(function (f) { return f.cross; }).map(function (f) { return f.id; }),
      high: T.filter(function (t) { return score(t) >= 15; }).map(function (t) { return t.id; }),
      treat: T.filter(function (t) { return score(t) >= 12; }).length,
      first: ranked[0].id,
      ranked: ranked.map(function (t) { return t.id; })
    }
  };
})();
</script>

<script>
(function () {
  var X = window.B1DATA, api0 = null;
  function A(k) { return function () { return X.answers[k]; }; }
  function scored() { var sc = (api0 && api0.note('sc')) || {}; return X.T.every(function (t) { return sc[t.id] && sc[t.id].L && sc[t.id].I; }); }
  var LOCK = 'Score all eight threats in the Threat register tab first (likelihood and impact menus). The ranking then fills in.';
  window.LAB = {
    id: 'B1',
    title: 'Threat Modeling Workshop',
    accent: 'Threat Modeling',
    domain: 'Domain 1 (13.6%)',
    time: '60 min',
    level: 'Intermediate',
    lessonHref: 'lesson01.html#s6',
    lessonLabel: 'Lesson 1, Threat Modeling',
    lede: 'Threat modeling finds design flaws while they are still cheap to fix. Mark the trust boundaries on a real data flow diagram, apply STRIDE per element, score and rank the threats against a written guide, and give the product owner a plan with mitigations and owners.',
    workbenchTitle: 'Threat model workbench',
    kus: ['Cyber Threats (CTH)', 'Security Risk Analysis (SRA)'],
    ticket: {
      number: 'SEC-2027-0614',
      priority: 'High priority',
      from: 'Asha Lindqvist, Director of Digital Care, Ellisford Clinics',
      to: 'Security architect, Information Security Office (you)',
      subject: 'Threat model for CareSlot before the launch review',
      due: 'Before the launch review on Friday',
      body: '<p>Ellisford Clinics runs fourteen primary care clinics. CareSlot, our new telehealth scheduling app, lets patients book visits and lets clinicians see their schedules. It checks insurance coverage with an insurer API and sends text reminders through an SMS provider. The beta has been open to 2,000 patients for six weeks.</p>' +
        '<p>The launch review board will not approve go-live without a threat model. Please mark where the trust boundaries are on the data flow diagram, work out which STRIDE threats apply to each kind of element, and score the eight threats the team has already raised using our scoring guide. I need to know which threats we must treat before launch, what you recommend for the top ones, and anything you think the board should formally accept.</p>' +
        '<p>Please keep it to the design. The team will turn your recommendations into tickets.</p>'
    },
    howTo: 'The <b>Data flow diagram</b> tab shows CareSlot&rsquo;s elements and twelve numbered flows. Use the <b>Element facts</b> tab to decide which flows cross a trust boundary, and mark them by clicking the flow on the diagram or ticking it in the list. Fill in the <b>STRIDE per element</b> worksheet. In the <b>Threat register</b>, score each threat with the <b>Scoring guide</b>; the ranking updates as you go. Check each checklist item when you are ready. Revealing a debrief before an item is verified earns 0 points for that item.',
    workIntro: 'Scores are likelihood times impact on 1 to 5 scales. Ties rank by impact first, because the board would rather prevent the worse outcome.',
    checklist: [
      { id: 'bounds', type: 'set', points: 12, short: 'Boundary flows', title: 'Flows that cross a trust boundary',
        task: 'Use the element facts to place the trust boundaries. Which data flows cross a trust boundary? Mark them on the diagram, then enter the flow IDs.',
        label: 'Flow IDs', placeholder: 'e.g., F1, F2',
        answer: A('cross'),
        hint: 'A boundary sits wherever data moves between elements with different privilege or a different party in control. The internet-facing gateway and the private services are not at the same privilege level.',
        debrief: '<p>Seven flows cross a boundary: <b>F1, F2, and F3</b> (patient and clinician devices to the gateway), <b>F4</b> (the internet-facing gateway to the private scheduling service), <b>F8 and F9</b> (to and from the insurer), and <b>F11</b> (to the SMS provider). F5, F6, F7, F10, and F12 stay inside the private subnet, where every element runs at the same trust level.</p><p>F4 is the one teams miss. The gateway handles untrusted input, so the scheduling service must not assume that what arrives from it is safe. Every boundary crossing is where you look hardest for spoofing, tampering, and disclosure. After this item is verified, the diagram can draw the trust zones for you.</p>',
        reviewNote: 'Trust boundaries sit where privilege or control changes; flows crossing them get the closest scrutiny.' },
      { id: 'sflow', type: 'set', points: 8, short: 'STRIDE: data flow', title: 'STRIDE categories for a data flow',
        task: 'Using the STRIDE-per-element mapping, which categories apply to a <b>data flow</b>? Enter the letters (S, T, R, I, D, E).',
        label: 'STRIDE letters', placeholder: 'e.g., S, T',
        answer: ['T', 'I', 'D'],
        hint: 'A flow is data in motion. What can happen to data on the wire? Impersonation and privilege belong to the endpoints.',
        debrief: '<p>A data flow attracts <b>Tampering, Information disclosure, and Denial of service</b>: data in motion can be altered, read, or blocked. Spoofing and elevation of privilege are threats to the endpoints, and repudiation belongs to the parties who act, not the wire. That is why T4 (reminder texts) and T7 (the forged coverage response) sit on flows.</p>',
        reviewNote: 'Data flows: tampering, information disclosure, denial of service.' },
      { id: 'slog', type: 'set', points: 8, short: 'STRIDE: audit log', title: 'STRIDE categories for the audit log (D2)',
        task: 'D2 is a data store, but it is also the audit log. Which STRIDE categories apply to <b>D2</b>? Enter the letters.',
        label: 'STRIDE letters', placeholder: 'e.g., T, I',
        answer: ['T', 'R', 'I', 'D'],
        hint: 'Start with what applies to any data store, then ask what a log is for. If someone can alter it, what can they deny?',
        debrief: '<p>Any data store attracts <b>Tampering, Information disclosure, and Denial of service</b>. A store that holds audit records adds <b>Repudiation</b>: if the log can be altered, or does not record who acted, it cannot prove who did what. T3 is exactly that weakness. Treating the log as an ordinary store would miss it.</p>',
        reviewNote: 'Data stores: T, I, D; an audit log adds repudiation.' },
      { id: 'authz', type: 'choice', points: 10, short: 'Fix for T2', title: 'Where to fix T2, the edited appointment ID',
        task: 'T2 lets a signed-in patient change someone else&rsquo;s appointment. Where must the fix be enforced?',
        options: ['In the mobile app, by hiding the appointment ID from the patient', 'At the API gateway, by checking that the ID is a valid number', 'In the scheduling service, by checking that the signed-in patient owns the appointment before any change', 'In the appointments database, by encrypting the appointment table'],
        answer: 2,
        hint: 'The client is on the far side of a trust boundary. Which element knows both who is signed in and who owns the appointment?',
        debrief: '<p>The authorization check belongs in the <b>scheduling service</b>, the element that holds the business rule and acts on the data. It must confirm, on every request, that the authenticated patient from F4 owns the appointment being changed. Hiding the ID in the app does nothing, because the attacker controls the client. A format check at the gateway lets a valid but foreign ID through, and encryption at rest does not stop an authorized service from changing the wrong row.</p><p>In STRIDE terms this is tampering that comes from missing authorization, so it also has an elevation of privilege flavor. Name the threat by what the attacker achieves, then fix it where the decision is made.</p>',
        reviewNote: 'Enforce authorization on the trusted side of the boundary, in the element that owns the decision.' },
      { id: 'high', type: 'set', points: 12, short: 'Scores 15+', title: 'Threats in the high band',
        task: 'After you score every threat, which threats score <b>15 or more</b>? Enter the threat IDs.',
        label: 'Threat IDs', placeholder: 'e.g., T1',
        answer: A('high'),
        locked: function () { return scored() ? false : LOCK; },
        hint: 'Read the scoring guide carefully. Active attempts in our own logs mean likelihood 5. A confirmed weakness anyone with a free account can reach is likelihood 4. Exposure of every patient record is impact 5.',
        debrief: '<p>Three threats score 15 or more: <b>T8</b> (backup bucket readable by any provider account, 4 x 5 = 20), <b>T1</b> (credential stuffing already under way, 5 x 4 = 20), and <b>T2</b> (the confirmed appointment ID flaw, 4 x 4 = 16). Under the Ellisford guide, all three must be treated before launch, and none can be accepted by the product team.</p><p>T6 is the trap. Its impact is the worst on the list, but code review and SAST give two working controls, so it scores 2 x 5 = 10. Severe impact alone does not make a threat the top priority.</p>',
        reviewNote: 'Score from the evidence and the guide; high impact with strong controls is not automatically high risk.' },
      { id: 'first', type: 'choice', points: 10, short: 'Top threat', title: 'The threat that ranks first',
        task: 'Two threats tie on score. Using the tie rule in the guide, which threat ranks first?',
        options: ['T1, credential stuffing at the gateway', 'T2, the edited appointment ID', 'T5, the bot flood during the vaccine campaign', 'T8, the readable backup bucket'],
        answer: 3,
        locked: function () { return scored() ? false : LOCK; },
        hint: 'T1 and T8 both score 20. The guide breaks ties by impact.',
        debrief: '<p><b>T8 ranks first.</b> T1 and T8 both score 20, and the guide breaks ties by impact: T8 is impact 5 (every patient&rsquo;s records), and T1 is impact 4 (many accounts). The tie rule reflects the board&rsquo;s preference to prevent the worse outcome first.</p><p>In practice both get treated before launch, and T8 is also the quickest to fix: one bucket policy change, then a CNAPP check in the pipeline so the same mistake cannot ship again.</p>',
        reviewNote: 'Rank by score, then by impact when scores tie.' },
      { id: 'treat', type: 'number', points: 8, short: 'Treat before launch', title: 'How many threats must be treated before launch?',
        task: 'The guide says any threat scoring <b>12 or more</b> must be treated before launch. How many of the eight threats is that?',
        answer: A('treat'), tol: 0, unit: 'threats',
        locked: function () { return scored() ? false : LOCK; },
        hint: 'Count the threats in the high band, then add those that score exactly 12 to 14. Check T4 and T5 carefully.',
        debrief: '<p><b>Five threats</b> must be treated before launch: T8 (20), T1 (20), T2 (16), T5 (12), and T4 (12). T6 (10), T7 (6), and T3 (4) can be scheduled after launch with a named owner, or formally accepted by the right person.</p><p>T4 is easy to underrate because it is not an attack. It happens with every reminder in normal operation, and that is why its likelihood is 4. Privacy threats often look like features until someone reads the lock screen.</p>',
        reviewNote: 'Apply the treatment threshold to every score, including non-attack privacy threats.' },
      { id: 'mit1', type: 'choice', points: 10, short: 'Mitigate T1', title: 'The mitigation for T1',
        task: 'Choose the mitigation that best treats T1, credential stuffing. Try it in the register&rsquo;s mitigation menu first.',
        options: ['Raise the minimum password length to 14 characters', 'Phishing-resistant MFA with passkeys, breached-password screening, and sign-in rate limits', 'Add a CAPTCHA to the sign-in page', 'Lock each account permanently after three failed sign-ins'],
        answer: 1,
        hint: 'The attacker already has valid passwords. Which option still works when the password is correct?',

      '<div class="lb-doc"><h4>Ellisford threat modeling standard, section 2</h4><ul>' +

      '<li>The public subnet and the private subnet are different privilege levels. Elements in the same subnet with the same service identity share a trust level.</li>' +
