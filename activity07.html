            { q: '“Nine internet-facing servers run an operating system that loses vendor support in 45 days.”', concept: 'metrics', options: ['A key risk indicator', 'A key performance indicator', 'A service level target', 'An audit exception'], answer: 0, why: 'It looks ahead and warns that risk is rising before an incident. That is a KRI.' },
            { q: 'Which evidence BEST shows management that backups are effective?', concept: 'metrics', options: ['Backup jobs reported 100 percent success', 'The backup vendor holds an ISO certificate', 'Backups are encrypted with AES-256', 'Quarterly test restores met the RTO'], answer: 3, why: 'A successful job proves only that data was written. A test restore that meets the RTO proves it can be recovered in time.' }
